# ─────────────────────────────────────────────────────────────
# Stage 3: Second Refinement (FCM₂→₃ + Head₃)
# Load stage-2 checkpoint; freeze everything up to and including stage 2.
# ─────────────────────────────────────────────────────────────
run_name: "stage3_tier3"

data_dir: "/content/VOCdevkit"

stage:       3
tier:        3
epochs:      4           # fine-tuning: further reduce epochs
batch_size:  16
num_workers: 4

# Even lower LR: stage-3 is the finest refinement; needs careful updates.
lr:           0.00005   
weight_decay: 0.0001

lr_milestones: [3]
lr_gamma:      0.1

center_radius: 0.75      # tightest radius — only the best-centered positives

checkpoint_dir: "/content/drive/MyDrive/cascade_fcos/checkpoints"
with_centerness_repred: true
num_stages: 3
